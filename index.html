<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наші меблі</title>
<meta name="theme-color" content="#23241e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Наші меблі">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg:#23241e; --accent:#727351; --text:#ecebe4; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  /* CRM займає весь екран; відступи під «чубчик» і нижню смугу iPhone */
  #crm { position:fixed; top:env(safe-area-inset-top); left:0; right:0; bottom:0; width:100%; height:calc(100% - env(safe-area-inset-top)); border:0; background:#f2f2ed; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
            background:var(--bg); color:var(--text); font:500 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; transition:opacity .35s; z-index:2; }
  #splash img { width:96px; height:96px; border-radius:22px; }
  #splash .spin { width:22px; height:22px; border:2px solid rgba(255,255,255,.2); border-top-color:var(--text); border-radius:50%; animation:s 0.8s linear infinite; }
  #splash .hint { max-width:320px; text-align:center; font-size:13px; opacity:.7; line-height:1.5; padding:0 20px; }
  #splash a { color:#d9dac0; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <div>Наші меблі</div>
  <div class="spin" id="spin"></div>
  <div class="hint" id="hint"></div>
</div>
<script>
  /* ══════════════════════════════════════════════════════════════
     ЄДИНЕ, ЩО ТРЕБА ЗМІНИТИ: посилання на вашу CRM (Apps Script).
     Apps Script → «Ввести в дію» → «Керувати розгортаннями» → скопіюйте
     «URL вебзастосунку» (закінчується на /exec) і вставте між лапками.
     ══════════════════════════════════════════════════════════════ */
  const CRM_URL = 'https://script.google.com/macros/s/AKfycbzG8kei-JIdUskmRHvKc3gdUM7jP8BYceKdOp4Ot9sw0Cch6s0NeY_-6cxJOStdpSUA/exec';

  const splash = document.getElementById('splash'), hint = document.getElementById('hint');
  const hideSplash = () => { if (!document.getElementById('splash')) return; splash.style.opacity = 0; setTimeout(() => splash.remove(), 400); };
  // Деякі браузери (Safari, Chrome з блокуванням сторонніх cookie) не дають CRM працювати «всередині» іншого сайту.
  // Тоді відкриваємо CRM напряму й запам'ятовуємо це на 1 день, щоб наступного разу не чекати.
  const DIRECT_KEY = 'crm_direct_v3';   // нова назва — стара позначка з часу збою більше не діє
  try { localStorage.removeItem('crm_direct_until'); localStorage.removeItem('crm_direct_v2'); } catch (e) {}
  const goDirect = remember => {
    try { if (remember) localStorage.setItem(DIRECT_KEY, String(Date.now() + 864e5)); } catch (e) {}
    location.replace(CRM_URL);
  };
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(CRM_URL)) {
    document.getElementById('spin').style.display = 'none';
    hint.innerHTML = 'Не вказано посилання на CRM.<br>Відкрийте файл <b>index.html</b> і вставте «URL вебзастосунку» в рядок <b>CRM_URL</b>.';
  } else if (+(localStorage.getItem(DIRECT_KEY) || 0) > Date.now() && !/[?&]embed=1/.test(location.search)) {
    goDirect(false);
  } else {
    let ready = false, alive = false;
    // CRM сама повідомляє, що запустилась (або що не змогла з'єднатися)
    window.addEventListener('message', e => {
      const st = e.data && e.data.crm;
      // 'alive' — сторінка CRM відкрилась (лише скасовує перехід «напряму»); заставку ховаємо, коли CRM повністю готова:
      // на телефонах вкладена сторінка Google інколи не перемальовується сама, доки не торкнешся екрана
      if (st === 'alive') { alive = true; hint.textContent = 'Підключаюся до таблиці…'; }
      if (st === 'ready') { ready = alive = true; hideSplash(); nudge(); }
      if (st === 'fail' && !ready) goDirect(false);
    });
    // змусити браузер перемалювати CRM (без цього iPhone інколи показує старий кадр до першого дотику)
    const nudge = () => [50, 400, 1200].forEach(ms => setTimeout(() => {
      f.style.transform = 'translateZ(0)'; void f.offsetHeight;
      requestAnimationFrame(() => { f.style.transform = ''; });
    }, ms));
    const f = document.createElement('iframe');
    f.id = 'crm';
    f.src = CRM_URL;
    f.allow = 'clipboard-write; fullscreen';
    document.body.appendChild(f);
    // через 4 с показуємо кнопку «Відкрити CRM», щоб ніколи не чекати на порожньому екрані
    setTimeout(() => { if (!alive) hint.innerHTML = 'Завантаження триває довше, ніж зазвичай…<br><br><a href="#" id="go" style="display:inline-block;padding:10px 18px;border-radius:10px;background:#727351;color:#fff;text-decoration:none;font-weight:600">Відкрити CRM</a>'; const g = document.getElementById('go'); if (g) g.onclick = ev => { ev.preventDefault(); goDirect(false); }; }, 4000);
    // якщо за 20 с сторінка CRM так і не відкрилась усередині — відкриваємо напряму
    // (повільний сервер Google після простою — не причина: тоді приходить 'alive')
    setTimeout(() => { if (!alive) { hint.textContent = 'Відкриваю CRM напряму…'; goDirect(true); } }, 20000);
  }

  // service worker — потрібен, щоб Android пропонував «Встановити застосунок»
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
